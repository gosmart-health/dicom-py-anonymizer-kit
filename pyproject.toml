[project]
name = "dicom-py-anonymizer-kit"
version = "0.1.0"
description = "Utilities for anonymizing DICOM data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"beautifulsoup4>=4.12.0",
	"pydantic>=2.12.5",
	"pydicom>=3.0.1",
	"requests>=2.32.0",
]

[project.scripts]
dicom-py-anonymizer-kit = "main:main"

[dependency-groups]
dev = [
	"pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]